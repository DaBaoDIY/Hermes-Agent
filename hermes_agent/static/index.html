<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes Agent</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">EC2 / Rocky Linux</p>
        <h1>Hermes Agent</h1>
      </div>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">连接中</span>
      </div>
    </header>

    <main class="shell">
      <section id="auth-panel" class="panel auth-panel hidden">
        <h2>访问令牌</h2>
        <div class="inline-form">
          <input id="token-input" type="password" autocomplete="current-password" placeholder="输入 setup token" />
          <button id="token-save" type="button">连接</button>
        </div>
      </section>

      <section class="workspace">
        <form id="config-form" class="panel config-panel">
          <div class="panel-heading">
            <h2>运行配置</h2>
            <button id="refresh-config" type="button" class="ghost">刷新</button>
          </div>

          <label>
            AWS Region
            <input id="aws_region" name="aws_region" autocomplete="off" />
          </label>

          <label>
            模型预设
            <select id="model-preset"></select>
          </label>

          <label>
            模型 ID
            <input id="model_id" name="model_id" autocomplete="off" />
          </label>

          <label>
            系统提示词
            <textarea id="system_prompt" name="system_prompt" rows="5"></textarea>
          </label>

          <div class="metrics-grid">
            <label>
              Temperature
              <input id="temperature" name="temperature" type="number" min="0" max="1" step="0.1" />
            </label>
            <label>
              Top P
              <input id="top_p" name="top_p" type="number" min="0" max="1" step="0.05" />
            </label>
            <label>
              Max tokens
              <input id="max_tokens" name="max_tokens" type="number" min="1" max="65000" step="1" />
            </label>
          </div>

          <div class="toggle-row">
            <label class="check">
              <input id="reasoning_enabled" name="reasoning_enabled" type="checkbox" />
              <span>Reasoning</span>
            </label>
            <select id="reasoning_effort" name="reasoning_effort">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </div>

          <div class="actions">
            <button type="submit">保存配置</button>
            <button id="test-bedrock" type="button" class="secondary">测试 Bedrock</button>
          </div>
        </form>

        <section class="panel chat-panel">
          <div class="panel-heading">
            <h2>对话窗口</h2>
            <button id="clear-chat" type="button" class="ghost">清空</button>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="chat-form" class="composer">
            <textarea id="chat-input" rows="3" placeholder="输入消息"></textarea>
            <button type="submit">发送</button>
          </form>
        </section>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
